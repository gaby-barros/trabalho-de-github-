<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Web (HTML/CSS/JS)</title>
    
    <style>
        /* Reset básico para melhor consistência */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex; /* Usando Flexbox no corpo para layout */
            flex-direction: column;
        }

        /* --- Header (Cabeçalho) --- */
        .header {
            background-color: #61dafb;
            padding: 20px;
            text-align: center;
        }

        .titulo {
            font-size: 24px;
            font-weight: bold;
            color: #282c34;
            margin: 0;
        }

        /* --- Body (Corpo Principal) --- */
        .body {
            flex: 1; /* Ocupa o espaço restante */
            padding: 30px;
            display: flex; /* Usando Flexbox para centralizar o conteúdo */
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centraliza verticalmente */
            text-align: center;
        }

        .texto {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* --- Botão (TouchableOpacity Equivalente) --- */
        .botao {
            background-color: #20232a;
            color: #ffffff;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; /* Indica que é clicável */
            margin-top: 10px;
            margin-bottom: 30px;
            transition: background-color 0.3s;
            
            /* Sombra CSS (box-shadow) */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .botao:hover {
            background-color: #282c34;
        }

        /* --- Contador --- */
        .contador {
            font-size: 22px;
            color: #333;
            font-weight: normal;
        }

        #valor-contador {
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>
    
    <header class="header">
        <h1 class="titulo">⚛️ Exemplo de Contador Web</h1>
    </header>

    <main class="body">
        <p class="texto">
            Pressione o botão para interagir e mudar o Estado (JavaScript):
        </p>
        
        <button id="botao-clique" class="botao">
            Clique Aqui
        </button>

        <p class="contador">
            Você clicou: <span id="valor-contador">0</span> vezes
        </p>
    </main>

    <script>
        // Variável de Estado
        let contadorCliques = 0;

        // 1. Obtém referências aos elementos HTML
        const botao = document.getElementById('botao-clique');
        const valorContador = document.getElementById('valor-contador');

        // 2. Define a função que lida com o evento de clique
        function lidarComClique() {
            // 2.1. Atualiza o "Estado"
            contadorCliques = contadorCliques + 1;

            // 2.2. Atualiza a UI (Interface do Usuário)
            valorContador.textContent = contadorCliques;

            console.log(`Contador atualizado: ${contadorCliques}`);
        }

        // 3. Adiciona o ouvinte de evento ao botão
        botao.addEventListener('click', lidarComClique);
    </script>
</body>
</html>
